---
# ansible_facts required by the role
__sap_ha_install_anydb_ibmdb2_required_facts:
  - architecture # subset: min, hardware
  - default_ipv4 # subset: interfaces
  - distribution # subset: min, hardware
  - distribution_major_version # subset: min, hardware
  - distribution_version # subset: min, hardware
  - hostname # subset: min, hardware
  - os_family # subset: min, hardware
  - system_vendor # subset: hardware

# (cloud) platform helper variable - leave empty for default = not cloud
__sap_ha_install_anydb_ibmdb2_platform: ''

# Internal variable to control logging of sensitive information
__sap_ha_install_anydb_ibmdb2_no_log: true

# SAP System IDs that are reserved and must not be used
# Reference: SAP Note 1979280
__sap_ha_install_anydb_ibmdb2_sid_prohibited: ['ADD', 'ADM', 'ALL', 'AMD', 'AND', 'ANY', 'ARE', 'ASC',
                                                'AUX', 'AVG', 'BIN', 'BIT', 'CDC', 'COM', 'CON', 'DAA',
                                                'DBA', 'DBM', 'DBO', 'DTD', 'ECO', 'END', 'EPS', 'EXE',
                                                'FOR', 'GET', 'GID', 'IBM', 'INT', 'KEY', 'LIB', 'LOG',
                                                'LPT', 'MAP', 'MAX', 'MEM', 'MIG', 'MIN', 'MON', 'NET',
                                                'NIX', 'NOT', 'NUL', 'OFF', 'OLD', 'OMS', 'OUT', 'PAD',
                                                'PRN', 'RAW', 'REF', 'ROW', 'SAP', 'SET', 'SGA', 'SHG',
                                                'SID', 'SQL', 'SUM', 'SYS', 'TMP', 'TOP', 'TRC', 'UID',
                                                'USE', 'USR', 'VAR']

# IBM Db2 HADR specific variables
__sap_ha_install_anydb_ibmdb2_hadr_port: 55000
__sap_ha_install_anydb_ibmdb2_hadr_timeout: 120
__sap_ha_install_anydb_ibmdb2_hadr_peer_window: 120

# IBM Db2 cluster manager commands
__sap_ha_install_anydb_ibmdb2_db2cm_path: /db2/db2{{ sap_ha_install_anydb_ibmdb2_sid | lower }}/sqllib/bin/db2cm

# Platform detection patterns
__sap_ha_install_anydb_ibmdb2_platform_detection:
  cloud_aws_ec2_vs:
    - 'amazon'
  cloud_gcp_ce_vm:
    - 'Google'
    - 'Google Compute Engine'
  cloud_ibmcloud_vs:
    - 'IBM Cloud Virtual Server'
  cloud_msazure_vm:
    - 'Microsoft Corporation'


